<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>车辆位置</title>
  <!-- 390×844 #phone-stage · 深色停车拍照页 · 示例数据 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-top: 44px;
      --safe-bottom: 34px;
      --safe-inline: 20px;
      --fs-title: 22px;
      --fs-body: 16px;
      --fs-caption: 13px;
      --bg: #121212;
      --surface: #1c1c1e;
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --divider: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --toggle-on: #3b82f6;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0a0a;
      font-family: var(--font-app);
      font-size: var(--fs-body);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
    }

    #phone-stage {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: var(--bg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
    }

    /* 系统状态栏 */
    .status-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px var(--safe-inline) 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text);
    }

    .status-icons svg {
      display: block;
    }

    /* 顶部分栏：仅车辆位置 */
    .page-header {
      flex-shrink: 0;
      padding: 8px var(--safe-inline) 16px;
      display: flex;
      justify-content: center;
    }

    .page-title-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }

    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 0 var(--safe-inline) 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* 位置信息 */
    .location-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 18px;
    }

    .location-info {
      flex: 1;
      min-width: 0;
    }

    .location-address {
      margin: 0 0 6px;
      font-size: var(--fs-title);
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .location-duration {
      margin: 0;
      font-size: var(--fs-caption);
      color: var(--text-secondary);
    }

    .nav-action {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 44px;
      border: none;
      background: none;
      padding: 4px 0 0;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-secondary);
    }

    .nav-action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 8px;
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .nav-distance {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-divider {
      height: 1px;
      background: var(--divider);
      margin-bottom: 18px;
    }

    /* 停车拍照开关 */
    .photo-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .photo-toggle-text h2 {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 600;
    }

    .photo-toggle-text p {
      margin: 0;
      font-size: var(--fs-caption);
      color: var(--text-secondary);
    }

    .toggle {
      position: relative;
      width: 51px;
      height: 31px;
      flex-shrink: 0;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      padding: 0;
      transition: background 0.2s;
    }

    .toggle.on {
      background: var(--toggle-on);
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s;
    }

    .toggle.on::after {
      transform: translateX(20px);
    }

    .toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* 可编辑车位信息 */
    .spot-edit-block {
      margin-bottom: 20px;
    }

    .spot-field {
      display: flex;
      align-items: baseline;
      gap: 0;
      margin-bottom: 10px;
    }

    .spot-label {
      flex-shrink: 0;
      font-size: var(--fs-body);
      color: var(--text);
      white-space: nowrap;
    }

    .editable-input,
    .editable-textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: var(--fs-body);
      line-height: 1.5;
      padding: 0;
      margin: 0;
      resize: none;
      outline: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .editable-input {
      flex: 1;
      min-width: 0;
    }

    .editable-input:focus,
    .editable-textarea:focus {
      border-bottom-color: rgba(59, 130, 246, 0.6);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
    }

    .editable-textarea {
      min-height: 48px;
    }

    .spot-field + .spot-field {
      margin-top: 10px;
    }

    .spot-field.stacked {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .spot-field.stacked .spot-label {
      white-space: normal;
    }

    .editable-input::placeholder,
    .editable-textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* 照片网格 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .photo-tile {
      position: relative;
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .photo-tile .badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 1;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      line-height: 1.4;
    }

    .photo-gray {
      width: 100%;
      height: 100%;
      background: #4a4a4e;
    }

    .photo-tile.add {
      cursor: pointer;
      background: #3a3a3e;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .photo-tile.add:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-footer {
      flex-shrink: 0;
      padding: 12px var(--safe-inline) 8px;
    }

    .btn-flash {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-family: inherit;
      font-size: var(--fs-body);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-flash:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-flash:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-flash:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-flash.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.45);
      color: #93c5fd;
    }

    /* 底部 Home 指示条 */
    .home-indicator {
      flex-shrink: 0;
      padding-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: calc(var(--safe-bottom) + 8px);
    }

    .home-indicator span {
      width: 134px;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
    }

  </style>
</head>
<body>
  <div id="phone-stage" role="application" aria-label="手机 App 390×844 · 车辆位置">
    <div class="status-bar" aria-hidden="true">
      <span>13:14</span>
      <div class="status-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <rect x="0" y="8" width="3" height="4" rx="0.5"/>
          <rect x="4.5" y="5" width="3" height="7" rx="0.5"/>
          <rect x="9" y="2" width="3" height="10" rx="0.5"/>
          <rect x="13.5" y="0" width="2.5" height="12" rx="0.5"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true">
          <path d="M8 10.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/>
          <path d="M1.5 4.8C3.6 2.7 5.7 1.5 8 1.5s4.4 1.2 6.5 3.3l-1.2 1.2C11.6 4 9.9 3 8 3S4.4 4 2.7 5.1L1.5 4.8z"/>
          <path d="M4.2 7.5C5.3 6.4 6.6 5.8 8 5.8s2.7.6 3.8 1.7l-1.2 1.2c-.7-.7-1.7-1.1-2.6-1.1s-1.9.4-2.6 1.1L4.2 7.5z"/>
        </svg>
        <span>80%</span>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/>
          <rect x="2" y="2" width="13" height="8" rx="1.5" fill="currentColor"/>
          <rect x="21" y="4" width="2.5" height="4" rx="1" fill="currentColor"/>
        </svg>
      </div>
    </div>

    <header class="page-header">
      <span class="page-title-pill" role="heading" aria-level="1">车辆位置</span>
    </header>

    <main class="app-main">
      <section class="location-row" aria-label="当前停车位置">
        <div class="location-info">
          <p class="location-address">中国蓝谷</p>
          <p class="location-duration">已停车2小时48分钟</p>
        </div>
        <button type="button" class="nav-action" aria-label="导航，距离 33 米">
          <span class="nav-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 2L4 20l8-4 8 4L12 2z" fill="currentColor" transform="rotate(45 12 12)"/>
            </svg>
          </span>
          <span class="nav-distance">33m</span>
        </button>
      </section>

      <div class="section-divider" role="separator"></div>

      <section class="photo-toggle-row" aria-label="停车拍照">
        <div class="photo-toggle-text">
          <h2>停车拍照</h2>
          <p>7月02日 上午10:26</p>
        </div>
        <button
          type="button"
          class="toggle on"
          id="photoToggle"
          role="switch"
          aria-checked="true"
          aria-label="停车拍照开关"
        ></button>
      </section>

      <section class="spot-edit-block" aria-label="车位信息，可编辑">
        <div class="spot-field">
          <span class="spot-label">车位号：</span>
          <input
            type="text"
            class="editable-input"
            id="spotNumber"
            value="B3242"
            aria-label="车位号"
            placeholder="请输入车位号"
          >
        </div>
        <div class="spot-field">
          <span class="spot-label">区域：</span>
          <input
            type="text"
            class="editable-input"
            id="spotArea"
            value="B3"
            aria-label="停车区域"
            placeholder="请输入停车区域"
          >
        </div>
        <div class="spot-field stacked">
          <span class="spot-label">环境描述：</span>
          <textarea
            class="editable-textarea"
            id="spotEnv"
            aria-label="环境描述"
            placeholder="请输入环境描述"
          >靠近电梯/楼梯口，旁边是白红色相间的墙和立柱</textarea>
        </div>
      </section>

      <section class="photo-grid" aria-label="环视照片">
        <div class="photo-tile"><span class="badge">俯视</span><div class="photo-gray" aria-hidden="true"></div></div>
        <div class="photo-tile"><span class="badge">前</span><div class="photo-gray" aria-hidden="true"></div></div>
        <div class="photo-tile"><span class="badge">后</span><div class="photo-gray" aria-hidden="true"></div></div>
        <div class="photo-tile"><span class="badge">左</span><div class="photo-gray" aria-hidden="true"></div></div>
        <div class="photo-tile"><span class="badge">右</span><div class="photo-gray" aria-hidden="true"></div></div>
        <button type="button" class="photo-tile add" aria-label="添加照片"><div class="photo-gray" aria-hidden="true"></div></button>
      </section>
    </main>

    <footer class="app-footer">
      <button type="button" class="btn-flash" id="btnFlash" aria-label="闪灯鸣笛找车">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        </svg>
        闪灯/鸣笛找车
      </button>
    </footer>

    <div class="home-indicator" aria-hidden="true"><span></span></div>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('photoToggle');
      toggle.addEventListener('click', function () {
        var on = toggle.classList.toggle('on');
        toggle.setAttribute('aria-checked', on ? 'true' : 'false');
      });

      document.querySelector('.photo-tile.add').addEventListener('click', function () {
        alert('示例：打开相机添加停车照片。');
      });

      document.querySelector('.nav-action').addEventListener('click', function () {
        alert('示例：跳转第三方地图导航至车辆位置。');
      });

      var flashBtn = document.getElementById('btnFlash');
      var flashTimer;
      flashBtn.addEventListener('click', function () {
        flashBtn.classList.add('active');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(function () {
          flashBtn.classList.remove('active');
        }, 2000);
      });
    })();
  </script>
</body>
</html>
