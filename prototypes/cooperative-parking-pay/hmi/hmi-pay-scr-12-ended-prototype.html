<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-12 · 会话结束</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --accent: #2563eb;
      --topbar-h: 48px;
      --dock-h: 80px;
      --main-bg: #eceff4;
      --text: #1a1d24;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); }
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #0b0f14;
      overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h);
      height: var(--topbar-h);
      padding: 0 26px;
      display: flex;
      align-items: center;
      background: #1c2128;
      color: #9aa3b2;
      font-size: 16px;
    }
    .main-wrap {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 48px;
    }
    .card {
      width: 640px;
      max-width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 40px 44px;
      border: 1px solid #d8dee9;
      box-shadow: 0 8px 28px rgba(15,23,42,.06);
      color: var(--text);
      text-align: center;
      opacity: .92;
    }
    .card h1 { margin: 0 0 12px; font-size: 28px; font-weight: 650; color: var(--muted); line-height: 1.3; }
    .card .summary { margin: 0 0 20px; font-size: 20px; color: #9ca3af; line-height: 1.5; }
    .scrub {
      margin: 0;
      padding: 16px 20px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 18px;
      color: #6b7280;
      line-height: 1.55;
      text-align: center;
    }
    .dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      color: #8b95a8;
      font-size: 17px;
    }
    .btn-dock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 10px;
      background: #2d333b;
      color: #e6e9ef;
      font-size: 20px;
      min-height: 52px;
      text-decoration: none;
      border: 1px solid #3d4450;
      font-family: inherit;
    }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-12-ended-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="hmi-pay-nav.js"></script>

    <article id="stage" aria-label="SCR-PAY-12 会话结束 F-12">
      <header class="status-bar"><span>会话已结束</span></header>
      <main class="main-wrap">
        <section class="card">
          <h1>停车会话已结束</h1>
          <p class="summary">朝阳合作停车场 · 已支付 ¥24.50（示例摘要）</p>
          <p class="scrub">二维码、卡号尾号等敏感信息已清理<br>审计字段保留于车云（示例）</p>
        </section>
      </main>
      <footer class="dock">
        <span>通知中心已同步脱敏（示例）</span>
        <a class="btn-dock" href="hmi-pay-index-prototype.html">返回索引</a>
      </footer>
    </article>
  </div>
</body>
</html>
