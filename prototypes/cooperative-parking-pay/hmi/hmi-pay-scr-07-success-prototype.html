<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-07 · 支付成功</title>
  <style>
    :root { --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif; --accent: #2563eb; --ok: #059669; }
    html, body { margin: 0; background: #0d1117; font-family: var(--font-hmi); }
    body { display: flex; align-items: center; justify-content: center;  min-height: 100vh; }
#stage { width: 1920px; height: 1080px; position: relative; border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.55); background: #0b0f14; overflow: hidden; }
    .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; background: #1c2128; color: #9aa3b2; font-size: 16px; }
    .sess-pill { padding: 4px 12px; border-radius: 999px; background: rgba(5,150,105,.25); color: #6ee7b7; font-size: 15px; }
    .main-wrap { position: absolute; top: 48px; left: 0; right: 0; bottom: 80px; background: #eceff4; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 14px; padding: 40px 48px; width: 720px; text-align: center; color: #1a1d24; border: 1px solid #d8dee9; }
    .ok-icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: rgba(5,150,105,.15); color: var(--ok); font-size: 40px; line-height: 72px; }
    h1 { margin: 0 0 16px; font-size: 34px; color: var(--ok); }
    .kv { text-align: left; font-size: 20px; margin: 24px 0; line-height: 1.8; }
    .link { color: var(--accent); font-size: 18px; }
    .dock { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #1c2128; color: #8b95a8; font-size: 17px; }
    .btn-dock { padding: 12px 28px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 20px; min-height: 52px; text-decoration: none; font-family: inherit; }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-07-success-prototype.html">
<div class="demo-wrap">
  <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
  <script src="hmi-pay-nav.js"></script>

  <article id="stage" aria-label="SCR-PAY-07 支付成功">
    <header class="status-bar"><span>16:48</span><span class="sess-pill">已支付</span><span>已同步 App（示例）</span></header>
    <main class="main-wrap">
      <section class="card">
        <span class="ok-icon" aria-hidden="true">✓</span>
        <h1>支付成功</h1>
        <p style="font-size:22px;margin:0">实付 <strong>¥24.50</strong> · 无感支付（示例）</p>
        <dl class="kv">
          <dt>流水号</dt><dd>TXN-20260520-9B2C（示例）</dd>
          <dt>时间</dt><dd>2026-05-20 16:48:02</dd>
          <dt>场端授权</dt><dd>已确认离场授权（示例）</dd>
        </dl>
        <a class="link" href="#">查看电子凭证（可选 P2）</a>
      </section>
    </main>
    <footer class="dock">
      <span>敏感信息将按策略清理（F-12）</span>
      <a class="btn-dock" href="hmi-pay-scr-11-exit-prototype.html">查看离场指引</a>
    </footer>
  </article>
</div>
</body>
</html>
