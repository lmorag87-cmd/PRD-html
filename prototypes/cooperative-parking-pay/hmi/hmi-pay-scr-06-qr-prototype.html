<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-06 · 扫码兜底</title>
  <style>
    :root { --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif; --accent: #2563eb; --warn: #d97706; }
    html, body { margin: 0; background: #0d1117; font-family: var(--font-hmi); }
    body { display: flex; align-items: center; justify-content: center; padding-top: 44px; min-height: 100vh; }
    .proto-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: rgba(13,17,23,.92); font-size: 13px; }
    .proto-nav a { padding: 6px 10px; border-radius: 8px; color: #cbd5e1; text-decoration: none; border: 1px solid rgba(255,255,255,.12); }
    .proto-nav a.on { background: var(--accent); color: #fff; }
    #stage { width: 1920px; height: 1080px; position: relative; border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.55); background: #0b0f14; overflow: hidden; }
    .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; padding: 0 26px; display: flex; align-items: center; justify-content: space-between; background: #1c2128; color: #9aa3b2; font-size: 16px; }
    .sess-pill { padding: 4px 12px; border-radius: 999px; background: rgba(217,119,6,.2); color: #fbbf24; font-size: 15px; }
    .adas-banner { position: absolute; top: 48px; left: 0; right: 0; padding: 10px 28px; background: rgba(37,99,235,.15); color: #bfdbfe; font-size: 17px; text-align: center; border-bottom: 1px solid rgba(37,99,235,.3); }
    .main-wrap { position: absolute; top: 88px; left: 0; right: 0; bottom: 80px; background: #eceff4; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 32px; }
    .card { background: #fff; border-radius: 14px; border: 1px solid #d8dee9; padding: 28px; color: #1a1d24; }
    .fee-card { width: 380px; }
    .fee-card .num { font-size: 56px; font-weight: 700; }
    .qr-card { text-align: center; width: 520px; }
    .qr-box { width: 280px; height: 280px; margin: 16px auto; border-radius: 12px; background: repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 8px,#f3f4f6 8px,#f3f4f6 16px); border: 2px solid #d1d5db; }
    .hint { font-size: 18px; color: #5c6570; margin-top: 8px; }
    .multi { margin-top: 16px; padding: 12px; border-radius: 10px; background: rgba(217,119,6,.1); border: 1px solid rgba(217,119,6,.35); font-size: 18px; color: #92400e; text-align: left; }
    .btn { padding: 12px 20px; border-radius: 10px; border: 1px solid #c5cdd8; background: #fff; font-size: 18px; min-height: 48px; cursor: pointer; font-family: inherit; margin-top: 12px; }
    .dock { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #1c2128; color: #8b95a8; font-size: 17px; }
    .btn-dock { padding: 12px 28px; border-radius: 10px; background: #2d333b; color: #e6e9ef; font-size: 20px; min-height: 52px; text-decoration: none; border: 1px solid #3d4450; font-family: inherit; margin-left: 10px; }
    .btn-dock.primary { background: var(--accent); border-color: #1d4ed8; }
  </style>
</head>
<body>
  <nav class="proto-nav">
    <a href="hmi-pay-index-prototype.html">索引</a>
    <a href="hmi-pay-scr-01-card-prototype.html">01</a>
    <a href="hmi-pay-scr-06-qr-prototype.html" class="on">06 扫码</a>
    <a href="hmi-pay-scr-07-success-prototype.html">07</a>
  </nav>
  <article id="stage" aria-label="SCR-PAY-06 扫码兜底 UC-02">
    <header class="status-bar"><span>16:45</span><span class="sess-pill">扫码兜底</span><span>示例</span></header>
    <p class="adas-banner" role="note">缴费宽限期内泊车辅助仍可用（智驾协同示例 · F-07）</p>
    <main class="main-wrap">
      <section class="card fee-card">
        <h2 style="margin:0 0 12px;font-size:24px">应付金额</h2>
        <p class="num">¥24.50</p>
        <p class="hint">ETC、无感均未成功（示例）</p>
        <p class="hint">会话绑定缴费主码</p>
      </section>
      <section class="card qr-card">
        <h2 style="margin:0;font-size:26px">请使用手机扫码支付</h2>
        <p class="hint">请调高屏幕亮度以便扫码</p>
        <span class="qr-box" role="img" aria-label="缴费二维码占位"></span>
        <p class="multi">检测到多个二维码，已为您选择<strong>停车缴费码</strong>（示例 TC-MQR-01）</p>
        <button type="button" class="btn" id="btnSwitch">更换二维码</button>
        <button type="button" class="btn">刷新二维码</button>
      </section>
    </main>
    <footer class="dock">
      <span>仅会话绑定主码可发起支付（示例）</span>
      <span>
        <a class="btn-dock" href="hmi-pay-scr-08-fail-prototype.html">模拟失败</a>
        <a class="btn-dock" href="hmi-pay-scr-05-processing-prototype.html">我已支付</a>
        <a class="btn-dock primary" href="hmi-pay-scr-07-success-prototype.html">模拟扫码成功</a>
      </span>
    </footer>
  </article>
  <script>
    document.getElementById('btnSwitch').addEventListener('click', function () {
      alert('示例：打开候选码列表（会话主码 / 场站统一码 / 其他）');
    });
  </script>
</body>
</html>
