<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-10 · 闸机不一致</title>
  <style>
    :root { --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif; --accent: #2563eb; --danger: #dc2626; }
    html, body { margin: 0; background: #0d1117; font-family: var(--font-hmi); }
    body { display: flex; align-items: center; justify-content: center;  min-height: 100vh; }
#stage { width: 1920px; height: 1080px; position: relative; border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.55); background: #1a0a0a; overflow: hidden; }
    .fullscreen { position: absolute; inset: 48px 0 80px; background: linear-gradient(180deg,#2a1515,#1a0a0a); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; text-align: center; color: #fecaca; }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { margin: 0 0 16px; font-size: 36px; color: #fca5a5; }
    p { font-size: 22px; max-width: 720px; line-height: 1.6; margin: 0 0 32px; color: #fda4af; }
    .cta { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 16px 28px; border-radius: 10px; font-size: 20px; min-height: 52px; border: 1px solid #7f1d1d; background: #450a0a; color: #fecaca; cursor: pointer; font-family: inherit; text-decoration: none; }
    .btn.primary { background: var(--accent); border-color: #1d4ed8; color: #fff; }
    .dock { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: #1c2128; color: #8b95a8; display: flex; align-items: center; padding: 0 28px; font-size: 17px; }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-10-gate-prototype.html">
<div class="demo-wrap">
  <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
  <script src="hmi-pay-nav.js"></script>

  <article id="stage" aria-label="SCR-PAY-10 闸机不一致 F-12">
    <header style="position:absolute;top:0;left:0;right:0;height:48px;background:#1c2128;color:#f87171;display:flex;align-items:center;padding:0 26px;font-size:16px"><span>出口未确认缴费</span></header>
    <main class="fullscreen" role="alert">
      <span class="icon" aria-hidden="true">⛔</span>
      <h1>出口未确认缴费</h1>
      <p>车机显示已支付，闸机校验<strong>未通过</strong>。请以闸机结果为准，请勿驶离。可补付或联系人工（示例 F-10/F-12）。</p>
      <span class="cta">
        <a class="btn primary" href="hmi-pay-scr-06-qr-prototype.html">补付 / 扫码</a>
        <button type="button" class="btn">联系人工</button>
        <a class="btn" href="hmi-pay-scr-09-pending-prototype.html">重新查询</a>
      </span>
    </main>
    <footer class="dock"><span>无「可离场」主按钮（PRD 约束）</span></footer>
  </article>
</div>
</body>
</html>
