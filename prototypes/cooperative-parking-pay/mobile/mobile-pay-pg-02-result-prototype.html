<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-02 · 微信收银台</title>
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --wx-green: #07c160; --wx-bg: #ededed; --text: #1a1d24; --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); color: var(--text); }
    #phone-stage {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 28px; background: var(--wx-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .pay-top {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 10px;
      background: var(--wx-green); color: #fff;
      display: flex; align-items: center; gap: 10px;
    }
    .pay-top .logo {
      width: 28px; height: 28px; border-radius: 6px; background: #fff;
      color: var(--wx-green); font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .pay-top h1 { margin: 0; flex: 1; font-size: 18px; font-weight: 600; }
    .pay-top .close {
      width: 36px; height: 36px; border: none; border-radius: 8px;
      background: rgba(255,255,255,.2); color: #fff; font-size: 20px;
    }
    .pay-main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px var(--safe-inline); text-align: center; }
    .merchant { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
    .amount { font-size: 44px; font-weight: 700; margin: 0 0 4px; }
    .amount small { font-size: 24px; }
    .card {
      margin: 20px 0; padding: 14px 16px; border-radius: 12px;
      background: #fff; text-align: left; font-size: 14px; line-height: 1.6;
    }
    .card p { margin: 6px 0; }
    .pay-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: #fff;
    }
    .btn-pay {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; border: none; border-radius: 8px;
      background: var(--wx-green); color: #fff; font-size: 17px; font-weight: 600;
      font-family: inherit; text-decoration: none;
    }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-pay-pg-02-result-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-pay-nav.js"></script>
    <article id="phone-stage" aria-label="PG-PAY-02 微信停车缴费">
      <header class="pay-top">
        <span class="logo" aria-hidden="true">微</span>
        <h1>向商户付款</h1>
        <button type="button" class="close" aria-label="关闭">×</button>
      </header>
      <main class="pay-main">
        <p class="merchant">朝阳合作停车场 B2</p>
        <p class="amount"><small>¥</small>24.50</p>
        <section class="card">
          <p><strong>停车缴费</strong></p>
          <p>车牌 京A·DEMO8 · 入场 15:30</p>
          <p>由车机二维码跳转（UC-02 扫码兜底 · 示例）</p>
        </section>
      </main>
      <footer class="pay-footer">
        <a class="btn-pay" href="mobile-pay-pg-04-pending-prototype.html">立即支付</a>
      </footer>
    </article>
  </div>
</body>
</html>
