<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-02 · 支付结果</title>
  <style>
    :root { --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif; --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px; --ok: #059669; --app-bg: #f5f6f8; --app-surface: #fff; }
    html, body { margin: 0; background: #0d1117; font-family: var(--font-app); }
    body { display: flex; align-items: center; justify-content: center; padding: 44px 24px 24px; min-height: 100vh; }
    .screen-nav { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 100; font-size: 12px; }
    .screen-nav a { padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.55); color: #e2e8f0; text-decoration: none; }
    .screen-nav a.on { background: #2563eb; }
    #phone-stage { width: 390px; height: 844px; border-radius: 28px; background: var(--app-bg); box-shadow: 0 24px 64px rgba(0,0,0,.5); display: flex; flex-direction: column; overflow: hidden; }
    .app-header { padding: var(--safe-top) var(--safe-inline) 12px; background: var(--app-surface); border-bottom: 1px solid #e5e7eb; }
    .app-header h1 { margin: 0; font-size: 24px; }
    .app-main { flex: 1; padding: 24px var(--safe-inline); text-align: center; }
    .ok { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; background: rgba(5,150,105,.15); color: var(--ok); font-size: 28px; line-height: 56px; }
    .card { background: var(--app-surface); border-radius: 14px; padding: 16px; margin-top: 20px; text-align: left; font-size: 15px; line-height: 1.6; border: 1px solid #e5e7eb; }
    .app-footer { padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom)); background: var(--app-surface); border-top: 1px solid #e5e7eb; }
    .btn { display: block; width: 100%; min-height: 48px; border-radius: 12px; background: #2563eb; color: #fff; border: none; font-size: 16px; font-family: inherit; text-decoration: none; line-height: 48px; text-align: center; }
  </style>
</head>
<body>
  <nav class="screen-nav">
    <a href="mobile-pay-pg-01-session-prototype.html">01</a>
    <a href="mobile-pay-pg-02-result-prototype.html" class="on">02</a>
    <a href="mobile-pay-pg-03-exit-prototype.html">03</a>
  </nav>
  <article id="phone-stage">
    <header class="app-header"><h1>支付结果</h1></header>
    <main class="app-main">
      <span class="ok" aria-hidden="true">✓</span>
      <h2 style="margin:0;font-size:22px;color:var(--ok)">支付成功</h2>
      <p style="color:#6b7280;margin-top:8px">¥24.50 · 无感（示例）</p>
      <section class="card">
        <p style="margin:0">流水号 TXN-20260520-9B2C<br>16:48 · 与车机一致</p>
      </section>
    </main>
    <footer class="app-footer">
      <a class="btn" href="mobile-pay-pg-03-exit-prototype.html">查看离场指引</a>
    </footer>
  </article>
</body>
</html>
