<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-04 · 支付处理中</title>
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --ali-blue: #1677ff; --text: #1a1d24; --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); color: var(--text); }
    #phone-stage {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 28px; background: #fff;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .pay-main {
      flex: 1; min-height: 0; padding: calc(var(--safe-top) + 40px) var(--safe-inline);
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #e5e7eb;
      border-top-color: var(--ali-blue); border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pay-main h1 { margin: 0; font-size: 20px; font-weight: 650; }
    .lead { margin: 10px 0 0; font-size: 15px; color: var(--muted); line-height: 1.5; max-width: 280px; }
    .warn {
      margin-top: 24px; padding: 12px 14px; border-radius: 10px; width: 100%;
      background: rgba(217,119,6,.08); border: 1px solid rgba(217,119,6,.3);
      font-size: 14px; color: #92400e; line-height: 1.5; text-align: left;
    }
    .pay-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      border-top: 1px solid #eee; font-size: 13px; color: var(--muted); text-align: center;
    }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-pay-pg-04-pending-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-pay-nav.js"></script>
    <article id="phone-stage" aria-label="PG-PAY-04 支付处理中">
      <main class="pay-main">
        <div class="spinner" role="status" aria-label="处理中"></div>
        <h1>支付处理中</h1>
        <p class="lead">正在与停车场确认扣款结果，请稍候…</p>
        <p class="warn"><strong>请勿重复支付。</strong>确认结果将回传车机。</p>
      </main>
      <footer class="pay-footer">
        <a href="mobile-pay-pg-03-exit-prototype.html" style="color:#1677ff;text-decoration:none">示例：跳转支付成功</a>
      </footer>
    </article>
  </div>
</body>
</html>
