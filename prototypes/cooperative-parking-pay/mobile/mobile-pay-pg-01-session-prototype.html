<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-01 · 停车会话</title>
  <!-- 390×844 #phone-stage；只读镜像 F-03；示例数据 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --fs-title: 24px; --fs-body: 16px; --fs-caption: 14px;
      --page-bg: #0d1117; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb; --ok: #059669;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--page-bg); font-family: var(--font-app); font-size: var(--fs-body); color: var(--text); }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 44px 24px 24px; }
    .screen-nav { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 100; font-size: 12px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
    .screen-nav a { padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.55); color: #e2e8f0; text-decoration: none; border: 1px solid rgba(255,255,255,.15); }
    .screen-nav a.on { background: var(--accent); }
    #phone-stage {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5); display: flex; flex-direction: column;
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 12px;
    }
    .app-header h1 { margin: 0; flex: 1; font-size: var(--fs-title); font-weight: 650; }
    .back { width: 44px; height: 44px; border: none; border-radius: 12px; background: #f3f4f6; font-size: 20px; font-family: inherit; }
    .app-main { flex: 1; overflow-y: auto; padding: 12px var(--safe-inline); }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;
      padding: 6px 12px; border-radius: 999px; font-size: var(--fs-caption); font-weight: 600;
      background: rgba(5,150,105,.1); color: var(--ok); border: 1px solid rgba(5,150,105,.3);
    }
    .card {
      background: var(--app-surface); border-radius: 14px; border: 1px solid #e5e7eb;
      padding: 16px; margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .fee { font-size: 32px; font-weight: 700; margin: 8px 0; }
    .meta { font-size: var(--fs-caption); color: var(--muted); line-height: 1.5; }
    .banner { padding: 12px; border-radius: 10px; background: rgba(37,99,235,.08); border: 1px solid rgba(37,99,235,.25); font-size: var(--fs-caption); color: #1d4ed8; margin-bottom: 12px; }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
    }
    .cta {
      width: 100%; min-height: 48px; border: none; border-radius: 12px;
      background: #e5e7eb; color: var(--muted); font-size: var(--fs-body); font-weight: 600; font-family: inherit;
    }
    .tabbar { display: flex; border-top: 1px solid #e5e7eb; padding-bottom: var(--safe-bottom); background: var(--app-surface); }
    .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; color: var(--muted); text-decoration: none; min-height: 44px; }
    .tab.on { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <nav class="screen-nav" aria-label="屏切换">
    <a href="mobile-pay-index-prototype.html">索引</a>
    <a href="mobile-pay-pg-01-session-prototype.html" class="on">01</a>
    <a href="mobile-pay-pg-02-result-prototype.html">02</a>
    <a href="mobile-pay-pg-04-pending-prototype.html">04</a>
  </nav>
  <article id="phone-stage" aria-label="PG-PAY-01 390x844">
    <header class="app-header">
      <button type="button" class="back" aria-label="返回">←</button>
      <h1>停车详情</h1>
    </header>
    <main class="app-main">
      <span class="sync-pill">已与车机同步</span>
      <p class="banner">请在<strong>车机</strong>完成 ETC / 无感 / 扫码支付（App 不提供主支付按钮）</p>
      <section class="card">
        <h2>朝阳合作停车场 B2</h2>
        <p class="meta">京A·DEMO8 · 入场 15:30 · 示例</p>
        <p class="fee">¥24.50</p>
        <p class="meta">状态：待支付 · 会话 PS-20260520-A3F2</p>
      </section>
      <section class="card">
        <h2>说明</h2>
        <p class="meta">支付结果与离场指引将推送至本页。弱网时展示上次同步快照（F-04）。</p>
      </section>
    </main>
    <footer class="app-footer">
      <button type="button" class="cta" disabled>请在车内完成支付</button>
    </footer>
    <nav class="tabbar" aria-label="Tab">
      <a class="tab" href="#">首页</a>
      <a class="tab on" href="mobile-pay-pg-01-session-prototype.html">停车</a>
      <a class="tab" href="#">我的</a>
    </nav>
  </article>
</body>
</html>
