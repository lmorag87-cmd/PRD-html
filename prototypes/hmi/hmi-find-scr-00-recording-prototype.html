<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-FIND-00 · 车位记录窗口</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-inset: 16px; --topbar-h: 48px; --dock-h: 80px;
      --frame-border: rgba(255,255,255,.12); --bar-bg: #1c2128;
      --main-bg: #eceff4; --card-bg: #fff; --text: #1a1d24; --muted: #5c6570;
      --accent: #2563eb; --warn: #d97706; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); font-size: 18px; }
    #stage {
      display: flex; flex-direction: column; border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px var(--frame-border);
      background: #0b0f14; overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h); padding: 0 calc(var(--safe-inset) + 10px);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; color: #9aa3b2; background: var(--bar-bg); border-bottom: 1px solid var(--frame-border);
    }
    .sess-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
      background: rgba(37,99,235,.25); color: #93c5fd; font-size: 15px;
    }
    .sess-pill::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: #60a5fa;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .4; } }
    .main-wrap {
      flex: 1; min-height: 0; background: var(--main-bg); color: var(--text);
      padding: 28px 40px; overflow: auto;
    }
    .main-wrap h1 { margin: 0 0 8px; font-size: 32px; font-weight: 650; }
    .sub { margin: 0 0 20px; color: var(--muted); font-size: 19px; }
    .warn-bar {
      padding: 14px 18px; border-radius: 12px; margin-bottom: 20px;
      background: rgba(217,119,6,.12); border: 1px solid rgba(217,119,6,.35);
      color: #92400e; font-size: 18px; line-height: 1.45;
    }
    .preview-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
    }
    .cam {
      aspect-ratio: 4/3; border-radius: 12px; border: 2px solid #d8dee9;
      background: linear-gradient(145deg, #dbeafe, #94a3b8);
      display: flex; align-items: flex-end; padding: 12px 14px;
      font-size: 20px; font-weight: 600; color: #334155;
    }
    .cam.chassis { background: linear-gradient(160deg, #334155, #64748b); color: #e2e8f0; }
    .progress-card {
      background: var(--card-bg); border-radius: var(--radius); border: 1px solid #d8dee9;
      padding: 24px 28px; max-width: 720px;
    }
    .progress-card p { margin: 0 0 12px; font-size: 20px; }
    .bar {
      height: 10px; border-radius: 999px; background: #e5e7eb; overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; width: 68%; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
    }
    .dock {
      flex: 0 0 var(--dock-h); padding: 0 calc(var(--safe-inset) + 12px);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bar-bg); border-top: 1px solid var(--frame-border); color: #8b95a8; font-size: 17px;
    }
    .dock-actions { display: flex; gap: 12px; }
    .btn-dock {
      padding: 12px 22px; border-radius: 10px; background: #2d333b; color: #e6e9ef;
      border: 1px solid #3d4450; cursor: pointer; min-height: 52px; font-size: 20px;
      font-family: inherit; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-dock.primary { background: var(--accent); border-color: #1d4ed8; color: #fff; }
    .btn-dock:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-find-scr-00-recording-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="找车界面索引"></nav>
    <script src="hmi-find-nav.js?v=20260521"></script>
    <article id="stage" role="application" aria-label="SCR-FIND-00 车位记录 1920×1080">
      <header class="status-bar">
        <span>16:38 · 5月20日</span>
        <span class="sess-pill" role="status">记录中 · B2</span>
        <span>P 挡 · 车速 0 · 示例</span>
      </header>
      <main class="main-wrap">
        <h1>驻车 · 车位记录窗口</h1>
        <p class="sub">P 挡 + 车速 0：环视 / 周视 / 底盘静态拍照；入库段关键帧已在后台写入同一素材索引（示例）</p>
        <div class="warn-bar" id="qualityWarn" role="alert">
          记录质量受限：光照不足 · 可补拍或手动输入车位号（示例）
        </div>
        <div class="preview-grid" aria-label="环视与底盘预览">
          <div class="cam">前</div>
          <div class="cam">后</div>
          <div class="cam">左</div>
          <div class="cam chassis">车底环境</div>
        </div>
        <section class="progress-card">
          <p><strong>采集进度</strong> · 静态照片写入索引（示例）</p>
          <div class="bar" aria-hidden="true"><i></i></div>
          <p style="margin-top:14px;color:var(--muted);font-size:17px">稳定驻车后生成记录点；覆盖时含入库段关键帧 + 本窗口素材（示例）</p>
        </section>
      </main>
      <footer class="dock">
        <span>请保持驻车 · 可稍后补录（示例）</span>
        <div class="dock-actions">
          <a class="btn-dock" href="hmi-find-scr-00a-ingress-prototype.html">入库段</a>
          <button type="button" class="btn-dock" id="btnLater">稍后</button>
          <a class="btn-dock primary" href="hmi-find-scr-01-confirm-prototype.html">确认车位</a>
        </div>
      </footer>
    </article>
  </div>
  <script>
    document.getElementById('btnLater').addEventListener('click', function () {
      alert('示例：稍后可在找车应用中补录。');
    });
  </script>
</body>
</html>
