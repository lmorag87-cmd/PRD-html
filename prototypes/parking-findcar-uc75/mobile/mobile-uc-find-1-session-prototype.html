<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC-FIND-1 · PG-FIND-01 停车会话</title>
  <!-- 390×844 #phone-stage；外深背景居中；--font-app 思源黑体；§7.5 示例。 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --fs-title: 24px; --fs-card-title: 18px; --fs-body: 16px; --fs-caption: 14px;
      --page-bg: #0d1117; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb; --accent-soft: rgba(37,99,235,.1);
      --ok: #059669; --warn: #d97706; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); font-size: var(--fs-body); color: var(--text); }
    #phone-stage {
      position: relative; overflow: hidden;
      border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 12px;
    }
    .back {
      width: 44px; height: 44px; border: none; border-radius: 12px; background: #f3f4f6;
      display: inline-flex; align-items: center; justify-content: center;
      color: #1a1d24; cursor: pointer; font-family: inherit; flex-shrink: 0;
    }
    .back svg { display: block; width: 22px; height: 22px; }
    .app-header h1 { margin: 0; flex: 1; font-size: var(--fs-title); font-weight: 650; }
    .icon-btn {
      width: 44px; height: 44px; border: none; border-radius: 12px; background: #f3f4f6;
      font-size: 18px; cursor: pointer; font-family: inherit;
    }
    .app-main { flex: 1; overflow-y: auto; padding: 12px var(--safe-inline) 16px; -webkit-overflow-scrolling: touch; }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;
      padding: 6px 12px; border-radius: 999px; font-size: var(--fs-caption); font-weight: 600;
      background: rgba(5,150,105,.1); color: var(--ok); border: 1px solid rgba(5,150,105,.3);
    }
    .sync-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .card {
      background: var(--app-surface); border-radius: var(--radius); border: 1px solid #e5e7eb;
      padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(15,23,42,.04);
    }
    .map-card {
      height: 168px; border-radius: 12px; margin-bottom: 12px; position: relative; overflow: hidden;
      background: linear-gradient(160deg, #dbeafe 0%, #e2e8f0 50%, #cbd5e1 100%);
      border: 1px solid #d1d5db;
    }
    .map-pin {
      position: absolute; left: 54%; top: 48%; width: 28px; height: 28px;
      background: var(--accent); border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      box-shadow: 0 4px 10px rgba(37,99,235,.35);
    }
    .map-label {
      position: absolute; bottom: 10px; left: 10px; padding: 6px 10px; border-radius: 8px;
      background: rgba(255,255,255,.92); font-size: var(--fs-caption); color: var(--muted);
    }
    .spot-title { margin: 0 0 4px; font-size: var(--fs-card-title); font-weight: 650; }
    .spot-meta { margin: 0; color: var(--muted); font-size: var(--fs-caption); }
    .dist { font-size: 36px; font-weight: 700; color: var(--accent); margin: 10px 0 4px; line-height: 1; }
    .tabs { display: flex; gap: 8px; margin: 12px 0 10px; }
    .tab {
      flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #e5e7eb;
      background: #f9fafb; font-size: var(--fs-caption); font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .tab.on { background: var(--accent-soft); border-color: rgba(37,99,235,.35); color: #1d4ed8; }
    .scroll-x {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch;
    }
    .thumb {
      flex: 0 0 100px; height: 72px; border-radius: 10px; border: 1px solid #e5e7eb;
      background: linear-gradient(145deg, #dbeafe, #cbd5e1);
      display: flex; align-items: flex-end; padding: 6px 8px;
      font-size: 12px; font-weight: 600; color: #475569;
    }
    .thumb.chassis { background: linear-gradient(160deg, #334155, #64748b); color: #e2e8f0; }
    .panel-hidden { display: none !important; }
    .app-tabbar {
      flex-shrink: 0; display: flex; border-top: 1px solid #e5e7eb; background: var(--app-surface);
      padding: 8px var(--safe-inline) calc(8px + var(--safe-bottom));
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-height: 48px; border: none; background: none; font-family: inherit;
      font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .tab-item.on { color: var(--accent); font-weight: 600; }
    .tab-item .ico { font-size: 22px; line-height: 1; }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
    }
    .btn-primary {
      width: 100%; min-height: 52px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: var(--fs-body); font-weight: 650;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-uc-find-1-session-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-find-nav.js"></script>
    <article id="phone-stage" role="application" aria-label="手机 App 390×844 · 停车会话">
    <header class="app-header">
      <button type="button" class="back" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14.5 6.5L9 12l5.5 5.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>找车</h1>
      <button type="button" class="icon-btn" id="btnShare" aria-label="分享">⎘</button>
    </header>
    <main class="app-main">
      <span class="sync-pill" role="status">已与爱车同步 · 16:41 记录</span>
      <article class="card">
        <div class="map-card" role="img" aria-label="地图占位">
          <div class="map-pin" aria-hidden="true"></div>
          <span class="map-label">示例 · B2 室内地图</span>
        </div>
        <p class="spot-title">B2 · A区 · 车位 128</p>
        <p class="spot-meta">2026-05-18 16:41 驻车记录</p>
        <p class="dist">86 m</p>
        <p class="spot-meta">直线距离至车辆（示例）</p>
      </article>
      <article class="card">
        <p class="spot-title" style="margin-bottom:8px">环境素材</p>
        <div class="tabs" role="tablist">
          <button type="button" class="tab on" id="tabS">环视</button>
          <button type="button" class="tab" id="tabC">底盘</button>
        </div>
        <div id="panelS" class="scroll-x">
          <div class="thumb">前</div>
          <div class="thumb">后</div>
          <div class="thumb">左</div>
          <div class="thumb">右</div>
        </div>
        <div id="panelC" class="scroll-x panel-hidden">
          <div class="thumb chassis" style="flex:0 0 140px">底盘抓拍</div>
          <div class="thumb chassis" style="flex:0 0 140px">透明底盘</div>
        </div>
      </article>
      <p class="spot-meta" style="padding:0 4px">会话 FC-20260518-A3 · 仅本账号可见（示例）</p>
    </main>
    <footer class="app-footer">
      <a class="btn-primary" href="mobile-uc-find-1-nav-prototype.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">导航到车位</a>
    </footer>
    <nav class="app-tabbar" aria-label="主导航">
      <button type="button" class="tab-item"><span class="ico">⌂</span>首页</button>
      <button type="button" class="tab-item on"><span class="ico">🅿</span>找车</button>
      <button type="button" class="tab-item"><span class="ico">○</span>我的</button>
    </nav>
    </article>
  </div>
  <script>
    (function () {
      var tabS = document.getElementById('tabS');
      var tabC = document.getElementById('tabC');
      var panelS = document.getElementById('panelS');
      var panelC = document.getElementById('panelC');
      function show(surround) {
        tabS.classList.toggle('on', surround);
        tabC.classList.toggle('on', !surround);
        panelS.classList.toggle('panel-hidden', !surround);
        panelC.classList.toggle('panel-hidden', surround);
      }
      tabS.addEventListener('click', function () { show(true); });
      tabC.addEventListener('click', function () { show(false); });
      document.getElementById('btnShare').addEventListener('click', function () {
        alert('示例：分享位置/照片粒度以产品与法务定稿为准。');
      });
    })();
  </script>
</body>
</html>
