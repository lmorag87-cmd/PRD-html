<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC-FIND-1 · PG-FIND-04 补拍补录</title>
  <!-- 390×844；手机端补充采集；示例数据。 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --fs-title: 24px; --fs-card-title: 18px; --fs-body: 16px; --fs-caption: 14px;
      --page-bg: #0d1117; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb; --warn: #d97706; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); font-size: var(--fs-body); color: var(--text); }
    #phone-stage {
      overflow: hidden; border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 12px;
    }
    .back {
      width: 44px; height: 44px; border: none; border-radius: 12px; background: #f3f4f6;
      display: inline-flex; align-items: center; justify-content: center;
      color: #1a1d24; text-decoration: none; flex-shrink: 0; cursor: pointer;
    }
    .back svg { display: block; width: 22px; height: 22px; }
    .app-header h1 { margin: 0; flex: 1; font-size: var(--fs-title); font-weight: 650; }
    .app-main { flex: 1; overflow-y: auto; padding: 12px var(--safe-inline); display: flex; flex-direction: column; gap: 12px; }
    .hint {
      padding: 12px 14px; border-radius: 12px; background: rgba(217,119,6,.1);
      border: 1px solid rgba(217,119,6,.3); color: #92400e; font-size: var(--fs-caption); line-height: 1.45;
    }
    .camera-box {
      height: 200px; border-radius: var(--radius); border: 2px dashed #cbd5e1;
      background: #111827; color: #94a3b8; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .camera-box span { font-size: 40px; }
    .card {
      background: var(--app-surface); border-radius: var(--radius); border: 1px solid #e5e7eb; padding: 16px;
    }
    .card label { display: block; font-size: var(--fs-caption); color: var(--muted); margin-bottom: 8px; }
    .field {
      width: 100%; min-height: 48px; padding: 12px; border-radius: 10px;
      border: 1px solid #e5e7eb; font-size: 18px; font-family: inherit;
    }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
    }
    .btn-primary {
      width: 100%; min-height: 52px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: var(--fs-body); font-weight: 650;
      font-family: inherit; cursor: pointer;
    }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-uc-find-1-supplement-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-find-nav.js"></script>
    <article id="phone-stage" role="application" aria-label="PG-FIND-04 补拍补录">
    <header class="app-header">
      <a class="back" href="mobile-uc-find-1-session-prototype.html" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14.5 6.5L9 12l5.5 5.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>补充记录</h1>
    </header>
    <main class="app-main">
      <p class="hint">光照不足或离车后发现信息不足时，可补拍照片或修正车位号（示例 · 需网络上传）</p>
      <button type="button" class="camera-box" id="btnCam" aria-label="打开相机补拍">
        <span>📷</span>
        <span style="font-size:var(--fs-body)">补拍环境照片</span>
      </button>
      <article class="card">
        <label for="spot">车位号（OCR 预填，可改错字）</label>
        <input id="spot" class="field" type="text" value="128" aria-label="车位号">
        <label for="floor" style="margin-top:12px">楼层 / 区域</label>
        <input id="floor" class="field" type="text" value="B2 · A区" aria-label="楼层区域">
      </article>
      <p style="margin:0;font-size:var(--fs-caption);color:var(--muted)">上传后追加至 media_index，不删除车端已入库素材</p>
    </main>
    <footer class="app-footer">
      <button type="button" class="btn-primary" id="btnUpload">上传补充</button>
    </footer>
    </article>
  </div>
  <script>
    document.getElementById('btnCam').addEventListener('click', function () {
      alert('示例：调起系统相机。');
    });
    document.getElementById('btnUpload').addEventListener('click', function () {
      alert('示例：上传成功，将同步至车云会话。');
      location.href = 'mobile-uc-find-1-session-prototype.html';
    });
  </script>
</body>
</html>
