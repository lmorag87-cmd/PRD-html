<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC-FIND-1 · PG-FIND-02 导航找车</title>
  <!-- 390×844 #phone-stage；示例数据。 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --fs-title: 24px; --fs-card-title: 18px; --fs-body: 16px; --fs-caption: 14px;
      --page-bg: #0d1117; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb; --ok: #059669; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); font-size: var(--fs-body); color: var(--text); }
    #phone-stage {
      overflow: hidden; border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 12px;
    }
    .back {
      width: 44px; height: 44px; border: none; border-radius: 12px; background: #f3f4f6;
      display: inline-flex; align-items: center; justify-content: center;
      color: #1a1d24; text-decoration: none; flex-shrink: 0; cursor: pointer;
    }
    .back svg { display: block; width: 22px; height: 22px; }
    .app-header h1 { margin: 0; flex: 1; font-size: var(--fs-title); font-weight: 650; }
    .app-main { flex: 1; overflow-y: auto; padding: 12px var(--safe-inline); display: flex; flex-direction: column; gap: 12px; }
    .map-full {
      flex: 1; min-height: 280px; border-radius: var(--radius); border: 1px solid #d1d5db;
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, #dbeafe, #e2e8f0 50%, #cbd5e1);
    }
    .pin-car, .pin-you {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .pin-you { left: 22%; bottom: 22%; background: var(--ok); }
    .pin-car { right: 18%; top: 20%; background: var(--accent); }
    .you, .dest {
      position: absolute; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,.95); border: 1px solid #e5e7eb;
    }
    .you { left: 12%; bottom: 18%; }
    .dest { right: 10%; top: 14%; color: var(--accent); }
    .stats {
      background: var(--app-surface); border-radius: var(--radius); border: 1px solid #e5e7eb;
      padding: 16px; display: flex; gap: 20px; align-items: baseline;
    }
    .stats .num { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; }
    .stats .lbl { font-size: var(--fs-caption); color: var(--muted); margin-top: 4px; }
    .guide {
      background: var(--app-surface); border-radius: var(--radius); border: 1px solid #e5e7eb;
      padding: 14px 16px; font-size: var(--fs-body); line-height: 1.55;
    }
    .guide strong { display: block; margin-bottom: 6px; font-size: var(--fs-card-title); }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
      display: flex; flex-direction: column; gap: 10px;
    }
    .btn {
      width: 100%; min-height: 52px; border-radius: 14px; font-size: var(--fs-body); font-weight: 650;
      cursor: pointer; font-family: inherit; border: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: #f3f4f6; color: var(--text); border: 1px solid #e5e7eb; }
    .app-tabbar {
      flex-shrink: 0; display: flex; border-top: 1px solid #e5e7eb; background: var(--app-surface);
      padding: 8px var(--safe-inline) calc(8px + var(--safe-bottom));
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      min-height: 48px; border: none; background: none; font-family: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .tab-item.on { color: var(--accent); font-weight: 600; }
    .tab-item .ico { font-size: 22px; }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-uc-find-1-nav-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-find-nav.js"></script>
    <article id="phone-stage" role="application" aria-label="手机 App · 导航找车">
    <header class="app-header">
      <a class="back" href="mobile-uc-find-1-session-prototype.html" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14.5 6.5L9 12l5.5 5.5" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1>步行找车</h1>
    </header>
    <main class="app-main">
      <section class="map-full" role="img" aria-label="步行找车地图占位">
        <span class="pin-you" aria-hidden="true"></span>
        <span class="pin-car" aria-hidden="true"></span>
        <span class="you">当前位置</span>
        <span class="dest">车位 128</span>
      </section>
      <section class="stats">
        <div>
          <div class="num">86</div>
          <div class="lbl">剩余 m</div>
        </div>
        <div>
          <div class="num">约2</div>
          <div class="lbl">分钟</div>
        </div>
      </section>
      <section class="guide">
        <strong>步行指引（示例）</strong>
        向东北方向前进 · 途经 A 区扶梯 · 最近电梯厅约 40 m。直线距离指引，非泊车轨迹回放。
      </section>
    </main>
    <footer class="app-footer">
      <button type="button" class="btn btn-primary" id="btnMap">打开第三方地图导航</button>
      <button type="button" class="btn btn-secondary" id="btnEnd">结束找车</button>
    </footer>
    <nav class="app-tabbar" aria-label="主导航">
      <button type="button" class="tab-item"><span class="ico">⌂</span>首页</button>
      <button type="button" class="tab-item on"><span class="ico">🅿</span>找车</button>
      <button type="button" class="tab-item"><span class="ico">○</span>我的</button>
    </nav>
    </article>
  </div>
  <script>
    document.getElementById('btnMap').addEventListener('click', function () {
      alert('示例：跳转高德/百度等第三方地图，携带脱敏坐标或场站 deep link（PRD FR-4）。');
    });
    document.getElementById('btnEnd').addEventListener('click', function () {
      window.location.href = 'mobile-uc-find-1-session-prototype.html';
    });
  </script>
</body>
</html>
