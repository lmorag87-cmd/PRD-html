<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC-FIND-1 · PG-FIND-00 推送落地</title>
  <!-- 390×844 #phone-stage；深链/推送示例。 -->
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --fs-title: 24px; --fs-card-title: 18px; --fs-body: 16px; --fs-caption: 14px;
      --page-bg: #0d1117; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb; --ok: #059669; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); font-size: var(--fs-body); color: var(--text); }
    #phone-stage {
      position: relative; overflow: hidden;
      border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
      display: flex; flex-direction: column;
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 12px;
    }
    .app-header h1 { margin: 0; flex: 1; font-size: var(--fs-title); font-weight: 650; }
    .app-main { flex: 1; overflow-y: auto; padding: 20px var(--safe-inline); display: flex; flex-direction: column; gap: 16px; }
    .push-card {
      background: var(--app-surface); border-radius: var(--radius); border: 1px solid #e5e7eb;
      padding: 20px; box-shadow: 0 4px 16px rgba(15,23,42,.06);
    }
    .push-icon {
      width: 48px; height: 48px; border-radius: 12px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 12px;
    }
    .push-card h2 { margin: 0 0 8px; font-size: var(--fs-card-title); }
    .push-card p { margin: 0; color: var(--muted); font-size: var(--fs-body); line-height: 1.45; }
    .summary {
      margin-top: 16px; padding-top: 16px; border-top: 1px solid #f3f4f6;
      font-size: var(--fs-caption); color: var(--muted);
    }
    .btn-primary {
      width: 100%; min-height: 52px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: var(--fs-body); font-weight: 650;
      cursor: pointer; font-family: inherit; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-ghost {
      width: 100%; min-height: 48px; border: 1px solid #e5e7eb; border-radius: 14px;
      background: #fff; color: var(--text); font-size: var(--fs-body); font-family: inherit; cursor: pointer;
    }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
      display: flex; flex-direction: column; gap: 10px;
    }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-uc-find-1-push-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-find-nav.js"></script>
    <article id="phone-stage" role="application" aria-label="PG-FIND-00 推送落地">
    <header class="app-header">
      <h1>车位已记录</h1>
    </header>
    <main class="app-main">
      <article class="push-card">
        <div class="push-icon" aria-hidden="true">🅿</div>
        <h2>您的爱车已停在 B2 · A-128</h2>
        <p>车辆已完成车位记录，离车后可在 App 查看位置并导航返回。</p>
        <p class="summary">会话 FC-20260520-A3 · 16:39 同步（示例）<br>深链 findcar://session/…</p>
      </article>
      <p style="margin:0;font-size:var(--fs-caption);color:var(--muted);padding:0 4px">
        锚点来自车云 record_point，非手机 GPS（示例）
      </p>
    </main>
    <footer class="app-footer">
      <a class="btn-primary" href="mobile-uc-find-1-session-prototype.html">查看车位</a>
      <button type="button" class="btn-ghost" id="btnDismiss">稍后</button>
    </footer>
    </article>
  </div>
  <script>
    document.getElementById('btnDismiss').addEventListener('click', function () {
      alert('示例：关闭推送落地页。');
    });
  </script>
</body>
</html>
