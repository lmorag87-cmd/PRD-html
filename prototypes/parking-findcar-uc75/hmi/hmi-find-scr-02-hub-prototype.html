<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-FIND-02 · 找车主页</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-inset: 16px; --topbar-h: 48px; --dock-h: 80px;
      --frame-border: rgba(255,255,255,.12); --bar-bg: #1c2128;
      --main-bg: #eceff4; --card-bg: #fff; --text: #1a1d24; --muted: #5c6570;
      --accent: #2563eb; --ok: #059669; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); font-size: 18px; }
    #stage {
      display: flex; flex-direction: column; border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px var(--frame-border);
      background: #0b0f14; overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h); padding: 0 calc(var(--safe-inset) + 10px);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; color: #9aa3b2; background: var(--bar-bg); border-bottom: 1px solid var(--frame-border);
    }
    .sess-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
      background: rgba(5,150,105,.2); color: #6ee7b7; font-size: 15px;
    }
    .sess-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
    .main-wrap { flex: 1; min-height: 0; background: var(--main-bg); color: var(--text); padding: 20px 28px; overflow: hidden; display: flex; flex-direction: column; }
    .cal-banner {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 12px;
      background: rgba(217,119,6,.12); border: 1px solid rgba(217,119,6,.35);
      color: #92400e; font-size: 18px; display: none;
    }
    .cal-banner.show { display: block; }
    .hub-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 400px; gap: 20px; }
    .map-panel {
      background: var(--card-bg); border-radius: var(--radius); border: 1px solid #d8dee9;
      position: relative; overflow: hidden; min-height: 0;
    }
    .map-bg {
      position: absolute; inset: 0;
      background: linear-gradient(165deg, #dbeafe 0%, #e2e8f0 45%, #cbd5e1 100%);
    }
    .pin {
      position: absolute; left: 62%; top: 38%; width: 36px; height: 36px;
      background: var(--accent); border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      box-shadow: 0 6px 16px rgba(37,99,235,.4);
    }
    .map-tools {
      position: absolute; top: 16px; right: 16px; display: flex; gap: 8px;
    }
    .map-tools button {
      min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #d8dee9;
      background: rgba(255,255,255,.92); font-size: 17px; font-family: inherit; cursor: pointer;
    }
    .side-stack { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow: auto; }
    .card {
      background: var(--card-bg); border-radius: var(--radius); border: 1px solid #d8dee9; padding: 20px 22px;
    }
    .card h2 { margin: 0 0 12px; font-size: 26px; }
    .spot-big { font-size: 36px; font-weight: 700; margin: 4px 0; }
    .poi { font-size: 18px; color: var(--muted); margin: 8px 0 0; line-height: 1.45; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .link-btn {
      min-height: 52px; padding: 12px 16px; border-radius: 10px; border: 1px solid #d8dee9;
      background: #f9fafb; font-size: 19px; font-family: inherit; cursor: pointer; text-align: left;
      text-decoration: none; color: var(--text); display: flex; align-items: center; justify-content: space-between;
    }
    .link-btn:hover { border-color: rgba(37,99,235,.4); }
    .thumb-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
    .mini {
      flex: 0 0 72px; height: 52px; border-radius: 8px; background: linear-gradient(145deg, #dbeafe, #94a3b8);
      border: 1px solid #d8dee9;
    }
    .mini.chassis {
      flex: 0 0 96px;
      background: linear-gradient(160deg, #334155, #64748b);
    }
    .dock {
      flex: 0 0 var(--dock-h); padding: 0 calc(var(--safe-inset) + 12px);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bar-bg); border-top: 1px solid var(--frame-border); color: #8b95a8;
    }
    .dock-actions { display: flex; gap: 12px; align-items: center; }
    .btn-dock {
      padding: 12px 22px; border-radius: 10px; background: #2d333b; color: #e6e9ef;
      border: 1px solid #3d4450; cursor: pointer; min-height: 52px; font-size: 20px; font-family: inherit;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-dock.primary { background: var(--accent); border-color: #1d4ed8; color: #fff; }
    .btn-home { min-width: 52px; justify-content: center; }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-find-scr-02-hub-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="找车界面索引"></nav>
    <script src="hmi-find-nav.js"></script>
    <article id="stage" role="application" aria-label="SCR-FIND-02 找车主页 1920×1080">
      <header class="status-bar">
        <span>16:41 · 5月20日</span>
        <span class="sess-pill" role="status">可找车</span>
        <span>车头向上 · 示例</span>
      </header>
      <main class="main-wrap">
        <div class="cal-banner show" id="calBanner" role="status">
          定位可能不准 · 建议重新采集或步行一段后更新（示例）
        </div>
        <div class="hub-grid">
          <section class="map-panel" aria-label="地图与记录点">
            <div class="map-bg"></div>
            <div class="pin" aria-label="记录点"></div>
            <div class="map-tools">
              <button type="button" id="toggleNorth">指北</button>
              <button type="button" onclick="location.href='hmi-find-scr-05-offline-prototype.html'">弱网快照</button>
            </div>
          </section>
          <aside class="side-stack">
            <section class="card">
              <h2>我的车位</h2>
              <p class="spot-big">B2 · A-128</p>
              <p class="poi">距电梯厅约 <strong>86 m</strong> · 直线指引（示例）</p>
              <p class="poi" style="font-size:16px">记录于 16:39</p>
            </section>
            <section class="card">
              <h2>环境照片</h2>
              <div class="actions">
                <a class="link-btn" href="hmi-find-scr-04-media-prototype.html">查看环境照片 <span>›</span></a>
              </div>
              <div class="thumb-row" aria-label="环境照片缩略图">
                <div class="mini" title="前"></div><div class="mini" title="后"></div>
                <div class="mini" title="左"></div><div class="mini" title="右"></div>
                <div class="mini chassis" title="车底环境"></div>
              </div>
            </section>
          </aside>
        </div>
      </main>
      <footer class="dock">
        <span>地图图钉 = 车位记录点（示例）</span>
        <div class="dock-actions">
          <button type="button" class="btn-dock btn-home" aria-label="Home">⌂</button>
          <a class="btn-dock" href="hmi-find-scr-00-recording-prototype.html">重新记录</a>
          <button type="button" class="btn-dock primary" id="btnFind">开始找车</button>
        </div>
      </footer>
    </article>
  </div>
  <script>
    document.getElementById('btnFind').addEventListener('click', function () {
      alert('示例：可进入场内导航或语音「导航到我的车位」。');
    });
    document.getElementById('toggleNorth').addEventListener('click', function (e) {
      e.target.textContent = e.target.textContent === '指北' ? '车头向上' : '指北';
    });
  </script>
</body>
</html>
