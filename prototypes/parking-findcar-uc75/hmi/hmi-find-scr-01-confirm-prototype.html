<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-find-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-FIND-01 · 确认车位</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --safe-inset: 16px; --topbar-h: 48px; --dock-h: 80px;
      --frame-border: rgba(255,255,255,.12); --bar-bg: #1c2128;
      --main-bg: #eceff4; --card-bg: #fff; --text: #1a1d24; --muted: #5c6570;
      --accent: #2563eb; --ok: #059669; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); font-size: 18px; }
    #stage {
      display: flex; flex-direction: column; border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px var(--frame-border);
      background: #0b0f14; overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h); padding: 0 calc(var(--safe-inset) + 10px);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 16px; color: #9aa3b2; background: var(--bar-bg); border-bottom: 1px solid var(--frame-border);
    }
    .sess-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
      background: rgba(217,119,6,.2); color: #fcd34d; font-size: 15px;
    }
    .main-wrap { flex: 1; min-height: 0; background: var(--main-bg); color: var(--text); padding: 24px 36px; overflow: auto; }
    .main-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .main-head h1 { margin: 0; font-size: 32px; font-weight: 650; }
    .sync-badge {
      font-size: 17px; padding: 8px 14px; border-radius: 999px; background: #fff;
      border: 1px solid rgba(5,150,105,.35); color: var(--ok);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 420px; gap: 24px; }
    .thumb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .thumb {
      aspect-ratio: 1; border-radius: 10px; border: 1px solid #d8dee9;
      background: linear-gradient(145deg, #dbeafe, #cbd5e1);
      display: flex; align-items: flex-end; padding: 10px; font-weight: 600; font-size: 17px;
    }
    .thumb.ch { background: linear-gradient(160deg, #334155, #64748b); color: #e2e8f0; }
    .thumb.chassis-one { grid-column: 1 / -1; aspect-ratio: 3 / 1; }
    .media-group { margin-bottom: 22px; }
    .media-group h3 {
      margin: 0 0 10px; font-size: 20px; font-weight: 650; color: var(--accent);
      display: flex; align-items: center; gap: 10px;
    }
    .media-group h3 span {
      font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
      background: rgba(36,91,219,.12); color: #1d4ed8;
    }
    .ingress-grid { display: flex; gap: 12px; flex-wrap: wrap; }
    .ingress-grid .thumb { flex: 0 0 140px; aspect-ratio: 4/3; position: relative; }
    .poi-tag {
      position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 600;
      padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,.92); color: #1d4ed8;
    }
    .card {
      background: var(--card-bg); border-radius: var(--radius); border: 1px solid #d8dee9;
      padding: 24px 28px;
    }
    .card h2 { margin: 0 0 16px; font-size: 26px; }
    .kv { display: grid; grid-template-columns: 100px 1fr; gap: 10px 16px; font-size: 19px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 500; }
    .field {
      margin-top: 16px; width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #d8dee9; font-size: 22px; font-family: inherit;
    }
    .dock {
      flex: 0 0 var(--dock-h); padding: 0 calc(var(--safe-inset) + 12px);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bar-bg); border-top: 1px solid var(--frame-border); color: #8b95a8;
    }
    .dock-actions { display: flex; gap: 12px; }
    .btn-dock {
      padding: 12px 22px; border-radius: 10px; background: #2d333b; color: #e6e9ef;
      border: 1px solid #3d4450; cursor: pointer; min-height: 52px; font-size: 20px; font-family: inherit;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-dock.primary { background: var(--accent); border-color: #1d4ed8; color: #fff; }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-find-scr-01-confirm-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="找车界面索引"></nav>
    <script src="hmi-find-nav.js?v=20260521"></script>
    <article id="stage" role="application" aria-label="SCR-FIND-01 确认车位 1920×1080">
      <header class="status-bar">
        <span>16:39 · 5月20日</span>
        <span class="sess-pill" role="status">待确认</span>
        <span>同步车云 · 示例</span>
      </header>
      <main class="main-wrap">
        <div class="main-head">
          <div>
            <h1>确认车位记录</h1>
            <p style="margin:8px 0 0;color:var(--muted)">OCR 预填 · 用户可改错字（示例）</p>
          </div>
          <span class="sync-badge" role="status">上传中…</span>
        </div>
        <div class="grid-2">
          <section aria-label="车位记录素材预览">
            <div class="media-group">
              <h3>入库段锚点 <span>2 张代表图</span></h3>
              <p style="margin:0 0 10px;font-size:16px;color:var(--muted)">低速接近时稀疏关键帧 · POI 已标注（示例）</p>
              <div class="ingress-grid">
                <div class="thumb"><span class="poi-tag">电梯厅</span>过道</div>
                <div class="thumb"><span class="poi-tag">A 区</span>立柱</div>
              </div>
            </div>
            <div class="media-group">
              <h3>驻车记录 <span>P 挡窗口</span></h3>
              <p style="margin:0 0 10px;font-size:16px;color:var(--muted)">环视四向 + 车底环境（可补拍）</p>
              <div class="thumb-grid">
                <div class="thumb">前</div><div class="thumb">后</div><div class="thumb">左</div><div class="thumb">右</div>
                <div class="thumb ch chassis-one">车底环境</div>
              </div>
            </div>
          </section>
          <section class="card">
            <h2>车位信息</h2>
            <dl class="kv">
              <dt>楼层</dt><dd>B2</dd>
              <dt>区域</dt><dd>A 区</dd>
              <dt>时间</dt><dd>2026-05-20 16:39</dd>
            </dl>
            <label for="spotNo" style="display:block;margin-top:12px;font-size:17px;color:var(--muted)">车位号</label>
            <input id="spotNo" class="field" type="text" value="128" aria-label="车位号">
            <p style="margin:14px 0 0;font-size:17px;color:var(--muted)">重新记录将覆盖入库段与驻车素材及记录点（示例）</p>
            <p style="margin:14px 0 0;font-size:17px;color:var(--ok)">保存后请在手机 App 查看记录点并导航找车</p>
          </section>
        </div>
      </main>
      <footer class="dock">
        <span>仅本车账号可见 · 图像用于找车（示例）</span>
        <div class="dock-actions">
          <a class="btn-dock" href="hmi-find-scr-00a-ingress-prototype.html">入库段</a>
          <button type="button" class="btn-dock" id="btnRerecord">重新记录</button>
          <a class="btn-dock primary" href="../mobile/mobile-uc-find-1-session-prototype.html">确认并保存</a>
        </div>
      </footer>
    </article>
  </div>
  <script>
    document.getElementById('btnRerecord').addEventListener('click', function () {
      if (confirm('示例：重新记录将回到采集窗口，更新车位记录点。')) {
        location.href = 'hmi-find-scr-00-recording-prototype.html';
      }
    });
  </script>
</body>
</html>
