<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRD 交互原型库</title>
  <style>
    :root { --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", sans-serif; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); background: #0d1117; color: #e6e9ef; padding: 40px 24px; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .sub { color: #9aa3b2; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; margin: 24px 0 12px; font-weight: 600; }
    a.card {
      display: block; padding: 18px 20px; margin-bottom: 10px; border-radius: 14px;
      background: #161b22; border: 1px solid rgba(255,255,255,.12); color: #e6e9ef;
      text-decoration: none; font-size: 18px;
    }
    a.card:hover { border-color: #2563eb; background: rgba(37,99,235,.1); }
    a.card .id { font-size: 13px; color: #6b7280; font-family: ui-monospace, monospace; margin-top: 6px; }
    a.card .desc { display: block; font-size: 14px; color: #9aa3b2; margin-top: 4px; }
    .soon { opacity: .45; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <h1>PRD 交互原型库</h1>
    <p class="sub">
      GitHub Pages · 按 PRD 项目分目录 · 仓库
      <a href="https://github.com/lmorag87-cmd/PRD-html" style="color:#60a5fa">lmorag87-cmd/PRD-html</a>
    </p>

    <h2>已发布</h2>
    <a class="card" href="cooperative-parking-pay/">
      合作停车场支付闭环
      <span class="id">cooperative-parking-pay/</span>
      <span class="desc">车机 IVI + 手机 App · F-01～F-12 · UC-01/02/03</span>
    </a>

    <h2>规划中</h2>
    <span class="card soon">
      （新 PRD 目录将出现在此处）
      <span class="id">例如：parking-find-car/</span>
    </span>
  </main>
</body>
</html>
