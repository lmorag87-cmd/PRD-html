<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>停车场支付 · 交互原型</title>
  <style>
    :root { --font: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", sans-serif; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); background: #0d1117; color: #e6e9ef; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { max-width: 520px; width: 100%; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #9aa3b2; line-height: 1.6; font-size: 15px; }
    a.card {
      display: block; margin-top: 16px; padding: 20px 22px; border-radius: 14px;
      background: #161b22; border: 1px solid rgba(255,255,255,.12); color: #e6e9ef;
      text-decoration: none; font-size: 18px; min-height: 52px;
    }
    a.card:hover { border-color: #2563eb; background: rgba(37,99,235,.12); }
    a.card span { display: block; font-size: 14px; color: #6b7280; margin-top: 6px; }
    .note { margin-top: 20px; padding: 14px 16px; border-radius: 10px; background: rgba(37,99,235,.08); border: 1px solid rgba(37,99,235,.25); font-size: 14px; color: #cbd5e1; }
  </style>

<body>
  <main>
    <h1>停车场支付</h1>

    <a class="card" href="hmi/hmi-pay-index-prototype.html">
      车机 IVI（1920×1080）
      <span>12 屏 · SCR-PAY-00～12</span>
    </a>
    <p class="note">本 PRD 交付范围仅含车机 HMI，不包含手机 App 支付界面。扫码由车主在个人手机上的支付宝/微信完成。</p>
  </main>
