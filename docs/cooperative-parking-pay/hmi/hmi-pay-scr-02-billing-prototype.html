<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-02 · 计费说明</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --accent: #2563eb;
      --topbar-h: 48px;
      --dock-h: 80px;
      --main-bg: #eceff4;
      --text: #1a1d24;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); }
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #0b0f14;
      overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h);
      height: var(--topbar-h);
      padding: 0 26px;
      display: flex;
      align-items: center;
      background: #1c2128;
      color: #9aa3b2;
      font-size: 16px;
    }
    .main-wrap {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      overflow: auto;
      padding: 28px 48px;
    }
    .content {
      max-width: 960px;
      margin: 0 auto;
      color: var(--text);
    }
    .content h1 { margin: 0 0 8px; font-size: 32px; font-weight: 650; line-height: 1.25; }
    .sub { font-size: 18px; color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    .card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid #d8dee9;
      padding: 24px 28px;
      margin-bottom: 16px;
      font-size: 19px;
      line-height: 1.6;
      box-shadow: 0 8px 28px rgba(15,23,42,.06);
    }
    .card h2 { margin: 0 0 12px; font-size: 24px; font-weight: 650; line-height: 1.3; }
    .card p { margin: 0; }
    details { margin-top: 12px; font-size: 18px; }
    details p { margin-top: 12px; color: var(--muted); }
    summary {
      cursor: pointer;
      color: var(--accent);
      min-height: 48px;
      display: flex;
      align-items: center;
      font-weight: 600;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    .dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      color: #8b95a8;
      font-size: 17px;
    }
    .btn-dock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      min-height: 52px;
      text-decoration: none;
      font-family: inherit;
      border: 1px solid #1d4ed8;
    }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-02-billing-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="hmi-pay-nav.js"></script>

    <article id="stage" aria-label="SCR-PAY-02 计费说明 F-05 F-04">
      <header class="status-bar"><span>计费说明</span></header>
      <main class="main-wrap">
        <div class="content">
          <h1>计费说明</h1>
          <p class="sub">会话 PS-20260520-A3F2 · 规则版本 v2.1（示例）</p>
          <section class="card">
            <h2>当前应付构成</h2>
            <p>首小时 10 元；之后每 30 分钟 3 元。已停 1h12m，合计 <strong>24.50 元</strong>（示例）。</p>
          </section>
          <section class="card">
            <h2>封顶与夜间</h2>
            <p>24 小时封顶 80 元；22:00–08:00 按夜间费率（示例字段）。</p>
            <details>
              <summary>常见问题 FAQ</summary>
              <p>调价将以横幅提示；长时间离线展示上次同步快照（F-04）。</p>
            </details>
          </section>
          <section class="card">
            <h2>操作流水（示例 P1）</h2>
            <p>16:40 切换至扫码 · 16:38 弱网缓存 · 15:30 入场识别</p>
          </section>
        </div>
      </main>
      <footer class="dock">
        <span>数据来自场端/车云接口（示例）</span>
        <a class="btn-dock" href="hmi-pay-scr-01-card-prototype.html">返回停车卡片</a>
      </footer>
    </article>
  </div>
</body>
</html>
