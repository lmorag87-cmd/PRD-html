<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-01-FAIL · 识别失败</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", "PingFang SC", sans-serif;
      --accent: #2563eb;
      --danger: #dc2626;
      --topbar-h: 48px;
      --dock-h: 80px;
      --main-bg: #eceff4;
      --text: #1a1d24;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); }
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #0b0f14;
      overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h);
      height: var(--topbar-h);
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      color: #9aa3b2;
      background: #1c2128;
    }
    .main-wrap {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 48px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 40px 48px;
      max-width: 880px;
      width: 100%;
      border: 1px solid #d8dee9;
      box-shadow: 0 8px 28px rgba(15,23,42,.06);
      color: var(--text);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(220,38,38,.12);
      color: var(--danger);
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      line-height: 1;
    }
    .card h1 { margin: 0 0 8px; font-size: 32px; font-weight: 650; line-height: 1.25; }
    .reason { font-size: 20px; color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    ul { margin: 0 0 28px; padding-left: 22px; font-size: 20px; line-height: 1.7; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 10px;
      font-size: 20px;
      min-height: 52px;
      line-height: 1.25;
      border: 1px solid #c5cdd8;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: #1d4ed8;
    }
    a.btn.link {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: #1c2128;
      color: #8b95a8;
      font-size: 17px;
    }
    .btn-dock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border-radius: 10px;
      background: #2d333b;
      color: #e6e9ef;
      font-size: 20px;
      min-height: 52px;
      line-height: 1.25;
      text-decoration: none;
      border: 1px solid #3d4450;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }
    dialog {
      border: none;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 520px;
      font-family: inherit;
      font-size: 18px;
    }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    dialog .dlg-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-01-fail-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="hmi-pay-nav.js"></script>

    <article id="stage" aria-label="SCR-PAY-01-FAIL">
      <header class="status-bar">
        <span>16:31</span>
        <span>识别失败</span>
        <span>示例</span>
      </header>
      <main class="main-wrap">
        <section class="card">
          <span class="icon" aria-hidden="true">!</span>
          <h1>未能识别入场</h1>
          <p class="reason">原因：车牌污损 / 逆光（示例分类 F-02）</p>
          <ul>
            <li>驶出识别区后重新驶入</li>
            <li>手动输入车牌（若场站支持）</li>
            <li>联系场站客服</li>
          </ul>
          <p class="reason" id="cooldown" aria-live="polite"></p>
          <div class="actions">
            <button type="button" class="btn primary" id="btnRetry">重试</button>
            <button type="button" class="btn" id="btnCancel">取消会话</button>
            <a class="btn link" href="hmi-pay-scr-00-recognizing-prototype.html">驶出重入</a>
          </div>
        </section>
      </main>
      <footer class="dock">
        <span>已中止支付探测（示例）</span>
        <a class="btn-dock" href="hmi-pay-scr-12-ended-prototype.html">会话已取消</a>
      </footer>
    </article>
    <dialog id="dlgCancel">
      <p><strong>确认取消？</strong></p>
      <p>将停止计费与支付探测。</p>
      <form method="dialog" class="dlg-actions">
        <button type="submit" class="btn" value="no">返回</button>
        <button type="submit" class="btn primary" value="yes">确认取消</button>
      </form>
    </dialog>
  </div>
  <script>
    (function () {
      var cooldown = 0, btn = document.getElementById('btnRetry'), label = document.getElementById('cooldown');
      function tick() {
        if (cooldown > 0) {
          btn.disabled = true;
          label.textContent = '请 ' + cooldown + ' 秒后再试（限频示例）';
          cooldown--;
          setTimeout(tick, 1000);
        } else {
          btn.disabled = false;
          label.textContent = '';
        }
      }
      btn.addEventListener('click', function () { cooldown = 5; tick(); });
      document.getElementById('btnCancel').addEventListener('click', function () {
        document.getElementById('dlgCancel').showModal();
      });
      document.getElementById('dlgCancel').addEventListener('close', function () {
        if (this.returnValue === 'yes') location.href = 'hmi-pay-scr-12-ended-prototype.html';
      });
    })();
  </script>
</body>
</html>
