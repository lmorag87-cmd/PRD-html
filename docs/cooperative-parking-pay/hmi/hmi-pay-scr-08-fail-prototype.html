<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-08 · 支付失败</title>
  <!-- 1920×1080 #stage；对齐车机壳层 -->
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --accent: #2563eb;
      --danger: #dc2626;
      --topbar-h: 48px;
      --dock-h: 80px;
      --main-bg: #eceff4;
      --card-bg: #fff;
      --text: #1a1d24;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 32px;
    }
    .demo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
#stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #0b0f14;
      overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h);
      height: var(--topbar-h);
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      color: #9aa3b2;
      font-size: 16px;
    }
    .status-bar .title { color: #fca5a5; font-size: 18px; font-weight: 600; }
    .main-wrap {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 48px;
    }
    .card {
      width: 720px;
      max-width: 100%;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 36px 40px;
      border: 1px solid #d8dee9;
      box-shadow: 0 8px 28px rgba(15,23,42,.06);
      color: var(--text);
    }
    .card h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 650;
      color: var(--danger);
      line-height: 1.25;
    }
    .card .code {
      margin: 0 0 20px;
      font-size: 19px;
      color: var(--muted);
      line-height: 1.5;
    }
    .detail-box {
      margin: 0 0 28px;
      padding: 16px 18px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }
    .detail-box summary {
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }
    .detail-box summary::-webkit-details-marker { display: none; }
    .detail-box summary::after {
      content: "›";
      font-size: 22px;
      color: var(--muted);
      transform: rotate(90deg);
      transition: transform .15s;
    }
    .detail-box[open] summary::after { transform: rotate(-90deg); }
    .detail-box p {
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 18px;
      color: var(--muted);
      line-height: 1.55;
    }
    .cta-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      border-radius: 10px;
      font-size: 20px;
      min-height: 52px;
      border: 1px solid #c5cdd8;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      color: var(--text);
    }
    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: #1d4ed8;
    }
    .dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      padding: 0 28px;
      display: flex;
      align-items: center;
      background: #1c2128;
      color: #8b95a8;
      font-size: 17px;
    }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-08-fail-prototype.html">
  <div class="demo-wrap">
      <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
  <script src="hmi-pay-nav.js"></script>
<article id="stage" aria-label="SCR-PAY-08 支付失败">
      <header class="status-bar">
        <span class="title">支付失败</span>
        <span>16:46 · 示例</span>
      </header>
      <main class="main-wrap">
        <section class="card">
          <h1>支付未成功</h1>
          <p class="code">失败码：BALANCE_LOW（示例）· 余额不足</p>
          <details class="detail-box">
            <summary>查看详情与诊断信息</summary>
            <p>建议：更换支付方式或使用手机扫码。已记录脱敏日志供客服查询。</p>
          </details>
          <div class="cta-col">
            <a class="btn primary" href="hmi-pay-scr-06-qr-prototype.html">扫码补付</a>
            <a class="btn" href="hmi-pay-scr-01-card-prototype.html">更换支付方式</a>
            <button type="button" class="btn" onclick="location.reload()">重试</button>
          </div>
        </section>
      </main>
      <footer class="dock">
        <span>归因文案来自错误码字典 OTA（示例）</span>
      </footer>
    </article>
  </div>
</body>
</html>
