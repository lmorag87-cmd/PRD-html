<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="hmi-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-PAY-07 · 支付成功</title>
  <style>
    :root {
      --font-hmi: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --accent: #2563eb;
      --ok: #059669;
      --topbar-h: 48px;
      --dock-h: 80px;
      --main-bg: #eceff4;
      --text: #1a1d24;
      --muted: #5c6570;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0d1117; font-family: var(--font-hmi); }
    #stage {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      background: #0b0f14;
      overflow: hidden;
    }
    .status-bar {
      flex: 0 0 var(--topbar-h);
      height: var(--topbar-h);
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      color: #9aa3b2;
      font-size: 16px;
    }
    .sess-pill {
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(5,150,105,.25);
      color: #6ee7b7;
      font-size: 15px;
      line-height: 1.3;
    }
    .main-wrap {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 48px;
    }
    .card {
      width: 720px;
      max-width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 40px 48px;
      border: 1px solid #d8dee9;
      box-shadow: 0 8px 28px rgba(15,23,42,.06);
      color: var(--text);
      text-align: center;
    }
    .ok-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(5,150,105,.15);
      color: var(--ok);
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .card h1 { margin: 0 0 12px; font-size: 34px; font-weight: 650; color: var(--ok); line-height: 1.25; }
    .card .lead { font-size: 22px; margin: 0 0 8px; color: var(--text); line-height: 1.4; }
    .kv {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px 20px;
      margin: 24px 0;
      font-size: 20px;
      text-align: left;
    }
    .kv dt { margin: 0; color: var(--muted); }
    .kv dd { margin: 0; font-weight: 500; color: var(--text); }
    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      color: var(--accent);
      font-size: 18px;
      text-decoration: underline;
    }
    .dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c2128;
      color: #8b95a8;
      font-size: 17px;
    }
    .btn-dock {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      min-height: 52px;
      text-decoration: none;
      font-family: inherit;
      border: 1px solid #1d4ed8;
    }
  </style>
</head>
<body class="hmi-proto-screen" data-nav-current="hmi-pay-scr-07-success-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="hmi-pay-nav.js"></script>

    <article id="stage" aria-label="SCR-PAY-07 支付成功">
      <header class="status-bar">
        <span>16:48</span>
        <span class="sess-pill">已支付</span>
        <span>已同步 App（示例）</span>
      </header>
      <main class="main-wrap">
        <section class="card">
          <span class="ok-icon" aria-hidden="true">✓</span>
          <h1>支付成功</h1>
          <p class="lead">实付 <strong>¥24.50</strong> · 无感支付（示例）</p>
          <dl class="kv">
            <dt>流水号</dt><dd>TXN-20260520-9B2C（示例）</dd>
            <dt>时间</dt><dd>2026-05-20 16:48:02</dd>
            <dt>场端授权</dt><dd>已确认离场授权（示例）</dd>
          </dl>
          <a class="link" href="#">查看电子凭证（可选 P2）</a>
        </section>
      </main>
      <footer class="dock">
        <span>敏感信息将按策略清理（F-12）</span>
        <a class="btn-dock" href="hmi-pay-scr-11-exit-prototype.html">查看离场指引</a>
      </footer>
    </article>
  </div>
</body>
</html>
