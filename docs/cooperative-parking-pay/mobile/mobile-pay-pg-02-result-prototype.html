<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-02 · 支付结果</title>
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --ok: #059669; --app-bg: #f5f6f8; --app-surface: #fff;
      --text: #1a1d24; --muted: #6b7280; --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); color: var(--text); }
    #phone-stage {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
    }
    .app-header h1 { margin: 0; font-size: 24px; font-weight: 650; line-height: 1.25; }
    .app-main { flex: 1; min-height: 0; padding: 24px var(--safe-inline); text-align: center; overflow-y: auto; }
    .ok {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
      background: rgba(5,150,105,.15); color: var(--ok); font-size: 28px;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .app-main h2 { margin: 0; font-size: 22px; color: var(--ok); line-height: 1.3; }
    .lead { color: var(--muted); margin: 8px 0 0; font-size: 16px; line-height: 1.5; }
    .card {
      background: var(--app-surface); border-radius: 14px; padding: 16px;
      margin-top: 20px; text-align: left; font-size: 15px; line-height: 1.6;
      border: 1px solid #e5e7eb;
    }
    .card p { margin: 0; }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
    }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; border-radius: 12px;
      background: var(--accent); color: #fff; border: 1px solid #1d4ed8;
      font-size: 16px; font-weight: 600; font-family: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-pay-pg-02-result-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-pay-nav.js"></script>
    <article id="phone-stage" aria-label="PG-PAY-02 支付结果">
      <header class="app-header"><h1>支付结果</h1></header>
      <main class="app-main">
        <span class="ok" aria-hidden="true">✓</span>
        <h2>支付成功</h2>
        <p class="lead">¥24.50 · 无感（示例）</p>
        <section class="card">
          <p>流水号 TXN-20260520-9B2C<br>16:48 · 与车机一致</p>
        </section>
      </main>
      <footer class="app-footer">
        <a class="btn" href="mobile-pay-pg-03-exit-prototype.html">查看离场指引</a>
      </footer>
    </article>
  </div>
</body>
</html>
