<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mobile-pay-proto-common.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PG-PAY-03 · 离场引导</title>
  <style>
    :root {
      --font-app: "Source Han Sans SC", "Noto Sans SC", "思源黑体", sans-serif;
      --safe-top: 47px; --safe-bottom: 34px; --safe-inline: 16px;
      --accent: #2563eb; --app-bg: #f5f6f8; --app-surface: #fff; --text: #1a1d24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font-app); color: var(--text); }
    #phone-stage {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 28px; background: var(--app-bg);
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .app-header {
      flex-shrink: 0; padding: var(--safe-top) var(--safe-inline) 12px;
      background: var(--app-surface); border-bottom: 1px solid #e5e7eb;
    }
    .app-header h1 { margin: 0; font-size: 24px; font-weight: 650; line-height: 1.25; }
    .app-main { flex: 1; min-height: 0; padding: 12px var(--safe-inline); overflow-y: auto; }
    .card {
      background: var(--app-surface); border-radius: 14px; padding: 16px;
      border: 1px solid #e5e7eb; font-size: 16px; line-height: 1.5;
    }
    .arrow { display: block; font-size: 40px; color: var(--accent); line-height: 1; margin-bottom: 8px; }
    .card p { margin: 0; }
    .app-footer {
      flex-shrink: 0; padding: 12px var(--safe-inline) calc(12px + var(--safe-bottom));
      background: var(--app-surface); border-top: 1px solid #e5e7eb;
    }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 48px; border-radius: 12px;
      border: 1px solid #e5e7eb; background: #fff;
      font-size: 16px; font-family: inherit; color: var(--text);
    }
  </style>
</head>
<body class="app-proto-screen" data-nav-current="mobile-pay-pg-03-exit-prototype.html">
  <div class="demo-wrap">
    <nav class="proto-nav" id="proto-nav" aria-label="全部界面索引"></nav>
    <script src="mobile-pay-nav.js"></script>
    <article id="phone-stage" aria-label="PG-PAY-03 离场引导">
      <header class="app-header"><h1>离场指引</h1></header>
      <main class="app-main">
        <section class="card">
          <span class="arrow" aria-hidden="true">→</span>
          <p><strong>驶往东区出口</strong><br>约 120 米（场端示例 · F-11 镜像）</p>
        </section>
      </main>
      <footer class="app-footer">
        <button type="button" class="btn" onclick="location.href='mobile-pay-index-prototype.html'">完成</button>
      </footer>
    </article>
  </div>
</body>
</html>
